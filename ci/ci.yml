# GitHub Actions CI workflow.
#
# NOTE: This file lives in ci/ because pushing it under .github/workflows/
# requires a token with the `workflow` OAuth scope. To activate CI, move it:
#     mkdir -p .github/workflows && git mv ci/ci.yml .github/workflows/ci.yml
# (or copy it via the GitHub web UI), then commit with a `workflow`-scoped token.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Tests (offline — LLM mocked, no API key needed)
        run: pytest --cov=app --cov-report=term-missing
